# Edge: serves the web app and spreads sockets across gateways.
# Any gateway can serve any user (state lives in Postgres/Redis), so no sticky
# sessions are needed; least_conn keeps socket counts balanced.

upstream gateways {
  least_conn;
  server gw1:8080 max_fails=1 fail_timeout=5s;
  server gw2:8080 max_fails=1 fail_timeout=5s;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /ws {
    proxy_pass http://gateways;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Origin $http_origin;
    # Long-lived sockets: gateways ping every 25s, so idle-timeout well above that.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location /api/ {
    proxy_pass http://gateways;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_next_upstream error timeout http_503;
  }

  location / {
    try_files $uri /index.html;
  }
}
